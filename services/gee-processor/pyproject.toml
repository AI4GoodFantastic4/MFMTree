[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gee-processor"
version = "0.1.0"
description = "Google Earth Engine processing pipeline for reforestation prioritisation"
requires-python = ">=3.11"
dependencies = ["earthengine-api==1.4.6"]

[tool.setuptools.packages.find]
where = ["src"]
